# Development profile: allow Hibernate to update JPA tables and let Spring AI create the
# pgvector vector_store table locally. Do NOT use initialize-schema=true in production;
# schema changes there should be applied via controlled migrations/ops runbooks.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.ai.vectorstore.pgvector.initialize-schema=true

logging.level.com.IntelligentDocumentQA=DEBUG
logging.level.org.springframework.ai=DEBUG

management.endpoint.health.show-details=always

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=postgres
spring.datasource.password=postgres

# Ollama model configuration
app.ollama.base-url=http://localhost:11434
app.ollama.chat-model=llama3
app.ollama.embedding-model=nomic-embed-text
