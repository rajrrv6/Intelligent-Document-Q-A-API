# Production profile: validate-only JPA and NO automatic pgvector schema initialization.
# Operators must ensure the vector extension, vector_store table, and indexes exist before deploy.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.ai.vectorstore.pgvector.initialize-schema=false

logging.level.root=WARN
logging.level.com.IntelligentDocumentQA=INFO
