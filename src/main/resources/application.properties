spring.application.name=intelligent-document-qa-api

spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.servlet.multipart.max-file-size=${INGESTION_MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${INGESTION_MAX_UPLOAD_SIZE:10MB}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Spring AI auto-configures OllamaChatModel, OllamaEmbeddingModel, and PgVectorStore.
# Custom beans are not required unless auto-configuration is disabled.
spring.ai.ollama.base-url=${app.ollama.base-url}
spring.ai.ollama.chat.options.model=${app.ollama.chat-model}
spring.ai.ollama.embedding.options.model=${app.ollama.embedding-model}
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=${PGVECTOR_DIMENSIONS:768}

# Ollama connectivity problems are logged at startup but do not abort the application,
# so /api/v1/system/status and /actuator/health remain available for diagnostics.
app.ingestion.chunk-size=${INGESTION_CHUNK_SIZE:1000}
app.ingestion.chunk-overlap=${INGESTION_CHUNK_OVERLAP:200}
app.ingestion.embedding-batch-size=${INGESTION_EMBEDDING_BATCH_SIZE:16}
app.ingestion.max-upload-size=${INGESTION_MAX_UPLOAD_SIZE:10MB}

app.ollama.base-url=http://localhost:11434
app.ollama.chat-model=phi3
app.ollama.embedding-model=nomic-embed-text
app.ollama.connect-timeout=${OLLAMA_CONNECT_TIMEOUT:5s}
app.ollama.read-timeout=${OLLAMA_READ_TIMEOUT:15s}

app.rag.default-top-k=${RAG_DEFAULT_TOP_K:2}
app.rag.default-similarity-threshold=${RAG_DEFAULT_SIMILARITY_THRESHOLD:0.30}
app.rag.max-prompt-size=${RAG_MAX_PROMPT_SIZE:1200}
app.rag.max-question-length=${RAG_MAX_QUESTION_LENGTH:1000}
app.rag.timeout=${RAG_TIMEOUT:120s}

server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Intelligent Document Q&A API - Spring AI infrastructure
