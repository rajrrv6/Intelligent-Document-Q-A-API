spring.datasource.url=jdbc:h2:mem:intelligent_doc_qa_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=com.IntelligentDocumentQA.config.TestH2Dialect

spring.autoconfigure.exclude=\
  org.springframework.ai.model.ollama.autoconfigure.OllamaApiAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration,\
  org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

spring.ai.vectorstore.pgvector.dimensions=768

DB_URL=jdbc:h2:mem:intelligent_doc_qa_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
DB_USERNAME=sa
DB_PASSWORD=
OLLAMA_BASE_URL=http://localhost:11434
OLLAMA_CHAT_MODEL=test-chat-model
OLLAMA_EMBEDDING_MODEL=test-embedding-model

app.ingestion.chunk-size=1000
app.ingestion.chunk-overlap=200
app.ingestion.embedding-batch-size=16
app.ingestion.max-upload-size=10MB

app.ollama.base-url=${OLLAMA_BASE_URL}
app.ollama.chat-model=${OLLAMA_CHAT_MODEL}
app.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL}
app.ollama.connect-timeout=1s
app.ollama.read-timeout=1s

management.endpoints.web.exposure.include=health,info
